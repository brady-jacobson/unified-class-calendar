[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vanderbilt-coursework-crawler"
version = "0.1.0"
description = "Local, authenticated coursework deadline aggregator"
requires-python = ">=3.11"
dependencies = ["playwright>=1.50", "pypdf>=6.0"]

[project.scripts]
coursework-crawler = "coursework_crawler.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
